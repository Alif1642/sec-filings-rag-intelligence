name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          DEMO_MODE: "true"
          SEC_USER_AGENT: "CI test@example.com"
        run: python -m pytest -v
      - name: API smoke test
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          python - <<'PY'
          import time, httpx
          for _ in range(20):
              try:
                  r = httpx.get('http://127.0.0.1:8000/health', timeout=2)
                  r.raise_for_status()
                  assert r.json()['status'] == 'ok'
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('API smoke test failed')
          PY
          kill $SERVER_PID
