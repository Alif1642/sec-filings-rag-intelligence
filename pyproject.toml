[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sec-filings-rag-intelligence"
version = "0.1.0"
description = "Citation-grounded SEC filing research and XBRL financial intelligence copilot"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Alif" }]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "faiss-cpu>=1.9.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "lxml>=5.3.0",
  "numpy>=1.26.4",
  "pandas>=2.2.3",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.2",
  "rank-bm25>=0.2.2",
  "requests>=2.32.3",
  "sentence-transformers>=3.1.1",
  "streamlit>=1.39.0",
  "transformers>=4.45.0",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.7.0",
]
postgres = [
  "pgvector>=0.3.5",
  "psycopg[binary]>=3.2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "app", "evals", "ingestion", "src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "live: optional tests requiring live SEC network access",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
